name: Build APK WebTV
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser le projet
        run: unzip -o WebTV-android-tv-projet.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compiler l'APK
        working-directory: webtv-browser
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WebTV-debug-apk
          path: webtv-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
