name: Build APK WebTV
on:
  push:
  workflow_dispatch:
permissions:
  contents: write   # nécessaire pour publier une Release téléchargeable
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compiler l'APK
        working-directory: webtv-browser
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WebTV-debug-apk
          path: webtv-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Sur un tag (ex: v1.0), publie une Release publique avec l'APK.
      # L'URL de l'APK est alors utilisable dans l'app "Downloader" (Fire TV / Google TV).
      - name: Publier une Release (sur tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: webtv-browser/app/build/outputs/apk/debug/app-debug.apk
