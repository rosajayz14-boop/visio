name: Build APK WebTV

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:   # permet de lancer le build manuellement depuis l'onglet Actions

permissions:
  contents: write       # nécessaire pour publier une Release (téléchargement public de l'APK)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # L'APK est téléchargeable depuis l'onglet Actions -> ce run -> "Artifacts"
      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: WebTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Si on pousse un tag (ex: v1.0), une Release publique est créée avec l'APK.
      # L'URL de l'APK devient alors utilisable dans l'app "Downloader" sur Fire TV / Google TV.
      - name: Publier une Release (sur tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
